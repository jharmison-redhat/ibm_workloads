---
- name: Validate required variables for destruction
  ansible.builtin.assert:
    that:
      - ibmcloud_api_key is defined
      - ibmcloud_api_key | length > 0
      - ibmcloud_resource_group_name is defined
      - ibmcloud_resource_group_name | length > 0
      - guid is defined
      - guid | length > 0
    fail_msg: |
      🚫 Missing required variables for destruction:
      - ibmcloud_api_key: {{ 'defined' if ibmcloud_api_key is defined else 'MISSING' }}
      - ibmcloud_resource_group_name: {{ 'defined' if ibmcloud_resource_group_name is defined else 'MISSING' }}
      - guid: {{ 'defined' if guid is defined else 'MISSING' }}

- name: Starting IBM RHAII Service destruction
  ansible.builtin.debug:
    msg: >-
      Destroying IBM RHAII Service in us-east (GUID: {{ guid }},
      Resource Group: {{ ibmcloud_resource_group_name }})
      [Note: RHAII requires us-east regardless of general region setting]

- name: Check if Terraform state exists
  ansible.builtin.stat:
    path: "{{ output_dir }}/terraform.tfstate"
  register: terraform_state_check

- name: Run Terraform destroy if state exists
  when: terraform_state_check.stat.exists
  block:
    - name: Get timestamp for log files
      ansible.builtin.command: date +%s
      register: timestamp_result
      changed_when: false

    - name: Set timestamp for log files
      ansible.builtin.set_fact:
        terraform_log_timestamp: "{{ timestamp_result.stdout }}"

    - name: Execute Terraform destroy
      community.general.terraform:
        project_path: "{{ output_dir }}"
        state: absent
        force_init: true
        variables:
          ibmcloud_api_key: "{{ ibmcloud_api_key }}"
          ibmcloud_resource_group_name: "{{ ibmcloud_resource_group_name }}"
          guid: "{{ guid }}"
      environment:
        PATH: "{{ user_path }}"
        TF_LOG: "DEBUG"
        TF_LOG_PATH: "{{ output_dir }}/terraform_destroy_{{ terraform_log_timestamp }}.log"
      register: r_terraform_destroy

    - name: IBM RHAII Service destruction completed
      ansible.builtin.debug:
        msg: "IBM RHAII Service destroyed successfully (GUID: {{ guid }}, Region: us-east)"

    - name: Clean up local Terraform files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ output_dir }}/main.tf"
        - "{{ output_dir }}/terraform.tfstate"
        - "{{ output_dir }}/terraform.tfstate.backup"
        - "{{ output_dir }}/.terraform"
      ignore_errors: true

  rescue:
    - name: Handle destroy failure
      ansible.builtin.debug:
        msg: "IBM RHAII Service destruction failed: {{ r_terraform_destroy.msg | default('Unknown error') }}. Manual cleanup may be required."

    - name: Continue with warning (don't fail)
      ansible.builtin.debug:
        msg: "Destruction completed with warnings. Manual verification recommended."

- name: Handle case when no Terraform state exists
  when: not terraform_state_check.stat.exists
  ansible.builtin.debug:
    msg: "No Terraform state file found. Resources may already be destroyed or deployed elsewhere."
